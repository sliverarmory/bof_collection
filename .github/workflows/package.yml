name: Package

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BOFLINK_ARCHIVE: boflink-v0.6.3-x86_64-unknown-linux-gnu.tar.gz
  BOFLINK_SHA256: 9e4e88185ceee61cfc959dfd572ed22619301b76db47a357ebc9b766364f9c00
  PACKAGE_BASENAME: beune-bof-collection

jobs:
  build:
    name: Build package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive exact package version
        shell: bash
        run: |
          set -euo pipefail
          package_version=v0.0.0
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            package_version="$GITHUB_REF_NAME"
            if [[ ! "$package_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag must have the exact form vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if [[ "$(git rev-list -n 1 "$package_version")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag does not resolve to the checked-out commit" >&2
              exit 1
            fi
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Install pinned MinGW toolchain and reviewed boflink
        shell: bash
        run: |
          set -euo pipefail
          readonly -a packages=(
            'binutils-mingw-w64-x86-64=2.41.90.20240122-1ubuntu1+11.4'
            'gcc-mingw-w64-base=13.2.0-6ubuntu1+26.1'
            'gcc-mingw-w64-x86-64-win32-runtime=13.2.0-6ubuntu1+26.1'
            'gcc-mingw-w64-x86-64-win32=13.2.0-6ubuntu1+26.1'
            'mingw-w64-common=11.0.1-3build1'
            'mingw-w64-x86-64-dev=11.0.1-3build1'
            'make=4.3-4.1build2'
          )
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          sudo update-alternatives --set \
            x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-win32
          test "$(update-alternatives --query x86_64-w64-mingw32-gcc | \
            sed -n 's/^Value: //p')" = /usr/bin/x86_64-w64-mingw32-gcc-win32
          x86_64-w64-mingw32-gcc -v 2>&1 | grep -Fqx 'Thread model: win32'
          test "$(x86_64-w64-mingw32-gcc -dumpfullversion)" = 13.2.0
          test "$(x86_64-w64-mingw32-gcc -dumpmachine)" = x86_64-w64-mingw32
          for spec in "${packages[@]}"; do
            package="${spec%%=*}"
            expected="${spec#*=}"
            actual="$(dpkg-query --show --showformat='${Version}' "$package")"
            if [[ "$actual" != "$expected" ]]; then
              printf 'version mismatch: %s expected %s got %s\n' \
                "$package" "$expected" "$actual" >&2
              exit 1
            fi
            printf '%s=%s\n' "$package" "$actual"
          done

          tool_archive="$RUNNER_TEMP/$BOFLINK_ARCHIVE"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$tool_archive" \
            "https://github.com/MEhrn00/boflink/releases/download/v0.6.3/$BOFLINK_ARCHIVE"
          printf '%s  %s\n' "$BOFLINK_SHA256" "$tool_archive" | sha256sum --check --strict
          tar -xzf "$tool_archive" -C "$RUNNER_TEMP"
          install -D -m 0755 \
            "$RUNNER_TEMP/boflink-v0.6.3-x86_64-unknown-linux-gnu/boflink" \
            "$RUNNER_TEMP/bin/boflink"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          x86_64-w64-mingw32-gcc --version
          "$RUNNER_TEMP/bin/boflink" --version
          test -d /usr/x86_64-w64-mingw32/lib

      - name: Build deterministic unsigned package
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 scripts/package.py --tag "$PACKAGE_VERSION" --output-dir release
          python3 scripts/validate_archive.py \
            --archive "release/$PACKAGE_BASENAME.tar.gz" \
            --tag "$PACKAGE_VERSION" \
            --inspect-objects

          second_source="$RUNNER_TEMP/reproducibility-source"
          second_output="$RUNNER_TEMP/reproducibility-output"
          mkdir -p "$second_source"
          git archive HEAD | tar -x -C "$second_source"
          python3 "$second_source/scripts/package.py" \
            --tag "$PACKAGE_VERSION" \
            --output-dir "$second_output"
          cmp \
            "release/$PACKAGE_BASENAME.tar.gz" \
            "$second_output/$PACKAGE_BASENAME.tar.gz"
          tar -tzf "release/$PACKAGE_BASENAME.tar.gz"
          sha256sum "release/$PACKAGE_BASENAME.tar.gz"

      - name: Upload unsigned package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-package
          path: release/beune-bof-collection.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Sign and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download unsigned package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-package
          path: release

      - name: Install Minisign before handling the key
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign=0.11-1
          test "$(dpkg-query --show --showformat='${Version}' minisign)" = 0.11-1
          minisign -v

      - name: Revalidate tag and unsigned archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must have the exact form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$GITHUB_REF_NAME")" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag does not resolve to the checked-out commit" >&2
            exit 1
          fi
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag commit is not contained in origin/master" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          python3 scripts/validate_archive.py \
            --archive "release/$PACKAGE_BASENAME.tar.gz" \
            --tag "$GITHUB_REF_NAME"
          tar -xOzf "release/$PACKAGE_BASENAME.tar.gz" ./extension.json \
            > "$RUNNER_TEMP/extension.json"
          base64 -w0 "$RUNNER_TEMP/extension.json" > "$RUNNER_TEMP/manifest.b64"

      - name: Sign and verify package
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          key_file="$RUNNER_TEMP/minisign.key"
          archive="release/$PACKAGE_BASENAME.tar.gz"
          signature="release/$PACKAGE_BASENAME.minisig"
          test -n "$MINISIGN_PRIVATE_KEY"
          printf '%s' "$MINISIGN_PRIVATE_KEY" > "$key_file"
          unset MINISIGN_PRIVATE_KEY

          public_key="$(sed -n '2p' minisign.pub)"
          manifest_b64="$(cat "$RUNNER_TEMP/manifest.b64")"
          minisign -S -s "$key_file" -m "$archive" -x "$signature" -t "$manifest_b64"
          minisign -V -P "$public_key" -m "$archive" -x "$signature"
          trusted_manifest="$(sed -n '3s/^trusted comment: //p' "$signature")"
          test "$trusted_manifest" = "$manifest_b64"

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/minisign.key"

      - name: Validate signed package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_archive.py \
            --archive "release/$PACKAGE_BASENAME.tar.gz" \
            --tag "$GITHUB_REF_NAME"
          python3 scripts/validate_signature.py \
            --archive "release/$PACKAGE_BASENAME.tar.gz" \
            --signature "release/$PACKAGE_BASENAME.minisig" \
            --public-key-file minisign.pub \
            --tag "$GITHUB_REF_NAME"

      - name: Stage draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "release/$PACKAGE_BASENAME.tar.gz" \
            "release/$PACKAGE_BASENAME.minisig" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$PACKAGE_BASENAME $GITHUB_REF_NAME" \
            --notes "Signed Sliver Armory package built from commit $GITHUB_SHA."

      - name: Verify staged release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft_dir="$RUNNER_TEMP/draft-release"
          mkdir -p "$draft_dir"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_BASENAME.*" \
            --dir "$draft_dir"
          cmp \
            "release/$PACKAGE_BASENAME.tar.gz" \
            "$draft_dir/$PACKAGE_BASENAME.tar.gz"
          cmp \
            "release/$PACKAGE_BASENAME.minisig" \
            "$draft_dir/$PACKAGE_BASENAME.minisig"
          test "$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq .draft)" = true

      - name: Publish immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Verify public release assets anonymously
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          public_dir="$RUNNER_TEMP/public-release"
          mkdir -p "$public_dir"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          for asset in "$PACKAGE_BASENAME.tar.gz" "$PACKAGE_BASENAME.minisig"; do
            downloaded=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --location --proto '=https' --tlsv1.2 \
                --output "$public_dir/$asset" "$release_url/$asset"; then
                downloaded=true
                break
              fi
              sleep 2
            done
            test "$downloaded" = true
            test -s "$public_dir/$asset"
          done

          expected_assets='["beune-bof-collection.minisig","beune-bof-collection.tar.gz"]'
          actual_assets="$(gh api \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '[.assets[].name] | sort')"
          test "$actual_assets" = "$expected_assets"
          release_api="repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$release_api" --jq .draft)" = false
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$release_api" --jq .prerelease)" = false
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$release_api" --jq .immutable)" = true
          latest_tag="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest_tag" = "$GITHUB_REF_NAME"
          release_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)"
          test "$release_commit" = "$GITHUB_SHA"

          cmp \
            "release/$PACKAGE_BASENAME.tar.gz" \
            "$public_dir/$PACKAGE_BASENAME.tar.gz"
          cmp \
            "release/$PACKAGE_BASENAME.minisig" \
            "$public_dir/$PACKAGE_BASENAME.minisig"

          python3 scripts/validate_archive.py \
            --archive "$public_dir/$PACKAGE_BASENAME.tar.gz" \
            --tag "$GITHUB_REF_NAME"
          python3 scripts/validate_signature.py \
            --archive "$public_dir/$PACKAGE_BASENAME.tar.gz" \
            --signature "$public_dir/$PACKAGE_BASENAME.minisig" \
            --public-key-file minisign.pub \
            --tag "$GITHUB_REF_NAME"
          sha256sum "$public_dir/$PACKAGE_BASENAME.tar.gz"
